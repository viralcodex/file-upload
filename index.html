<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chunked File Upload</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/css.css">
</head>

<body>
    <main class="page-shell">
        <section class="upload-card">
            <h1>File Upload</h1>

            <input type="file" id="fileInput">

            <section class="file-panel">
                <div class="file-panel-toolbar">
                    <span class="file-panel-title">Files</span>
                    <div class="file-panel-actions">
                        <button id="deleteButton" class="toolbar-btn toolbar-btn--danger" type="button" title="Delete selected">Delete</button>
                        <button id="refreshButton" class="toolbar-btn toolbar-btn--ghost" type="button" title="Refresh file list">&#x21bb;</button>
                        <button id="addButton" class="toolbar-btn toolbar-btn--primary" type="button" title="Add file">+</button>
                    </div>
                </div>
                <ul id="fileList" class="file-list">
                    <li class="file-item file-item--empty">No files yet. Click + to add one.</li>
                </ul>
            </section>
            <section class="user-panel">
                <button id="registerButton" class="toolbar-btn toolbar-btn--primary">Register User</button>
            </section>
        </section>
    </main>

    <script type="module" src="/client.ts"></script>
</body>
</html>
